# Full stack — the app (built from ./Dockerfile) together with its MySQL.
#
#   docker compose -f docker-compose.full.yml up --build
#
# For day-to-day local dev where you run the app with `uv run poe run` and only
# need the database, use the default docker-compose.yml instead.

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=shougong
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - shougong-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=prod
      - HTTP_PORT=8080
      - LOG_LEVEL=INFO
      - MYSQL__HOST=mysql
      - MYSQL__PORT=3306
      - MYSQL__USER=root
      - MYSQL__PASSWORD=
      - MYSQL__DATABASE=shougong
      - GATEWAYS__APP__HOST=http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  shougong-mysql-data:

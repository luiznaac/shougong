# Full stack in one command: the combined app image (FastAPI backend + built
# SPA, from ./Dockerfile) plus its MySQL.
#
#   docker compose up --build        # everything
#   docker compose up -d mysql       # just the DB (for local `cd backend && uv run poe run`)
#
# The published image (docker.io/luiznaac/shougong) is the `app` service only —
# in production the database is a separate, externally provisioned container.
#
# The schema is NOT seeded here: backend/alembic/versions/*.py is applied by
# `python scripts/migrate.py` from deploy/entrypoint.sh before the app starts.

services:
  mysql:
    image: mysql:26.10
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=shougong
    ports:
      - "${MYSQL__PORT:-8132}:3306"
    volumes:
      - shougong-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: luiznaac/shougong:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=INFO
      # Telemetry: APP_ENV=prod requires an endpoint, and no Collector ships in
      # this compose. Export OTEL_EXPORTER_OTLP_ENDPOINT to the host/infra
      # Collector (e.g. http://host.docker.internal:4318); it is passed through
      # with no default, so an unset endpoint fails the app's boot loudly rather
      # than silently degrading. A configured-but-down Collector only degrades
      # (one WARN, retries).
      - OTEL_SERVICE_NAME=shougong
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SEMCONV_STABILITY_OPT_IN=http,database
      # Emergency export stop, no code change (keep the endpoint above):
      # - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      # - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - API_PORT=8080
      - WEB_PORT=8081
      # Container-internal: the app serves here, so the self-health gateway
      # derives http://localhost:8080 instead of the assigned host port.
      - HTTP_PORT=8080
      - DICTIONARY_AUTOLOAD=true
      - STUDY_TIMEZONE=America/Sao_Paulo
      - MYSQL__HOST=mysql
      - MYSQL__PORT=3306
      - MYSQL__USER=root
      - MYSQL__PASSWORD=
      - MYSQL__DATABASE=shougong
      - GATEWAYS__AI__BASE_URL=${GATEWAYS_AI_BASE_URL:-http://localhost:4000}
      - GATEWAYS__AI__API_KEY=${GATEWAYS_AI_API_KEY:-}
    # Lets the OTLP endpoint default reach a Collector running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8130}:8080"       # API      (uvicorn)
      - "${WEB_HOST_PORT:-8131}:8081"   # web / UI  (nginx: SPA + /api proxy)

volumes:
  shougong-mysql-data:

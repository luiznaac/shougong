; Program definitions, included by /etc/supervisor/supervisord.conf.
; Both processes log to the container's stdout/stderr.

[program:api]
# Metrics own per-request volume: no uvicorn access log (4xx/5xx get one
# boundary record from the app instead).
command=/app/.venv/bin/uvicorn shougong.application.boot:app --host 0.0.0.0 --port %(ENV_API_PORT)s --no-access-log
directory=/app
user=app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopasgroup=true
# The SDK shutdown flush has a 10 s deadline; give it room before SIGKILL.
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Program definitions, included by /etc/supervisor/supervisord.conf.
; Both processes log to the container's stdout/stderr.

[program:api]
command=/app/.venv/bin/uvicorn shougong.application.boot:app --host 0.0.0.0 --port %(ENV_API_PORT)s
directory=/app
user=app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

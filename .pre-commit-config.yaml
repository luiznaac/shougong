repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master, --branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: sh -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: sh -c 'cd backend && uv run lint-imports'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: sh -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: test-frontend
        name: test (vitest)
        entry: sh -c 'cd frontend && npm test'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
      - id: test-backend
        name: test (pytest)
        entry: sh -c 'cd backend && uv run poe test'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
